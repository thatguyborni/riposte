body{margin:0;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(120% 90% at 50% 0%,#17142A 0%,#08070F 62%);
  font-family:"Press Start 2P",ui-monospace,Menlo,monospace}
.cab{height:100%;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:12px 10px;gap:9px}
.bezel{flex:1 1 auto;width:100%;max-width:1340px;min-height:0;border-radius:22px;padding:14px;
  background:linear-gradient(180deg,#1E1C2A,#0E0D15);
  box-shadow:0 0 0 1px #2B2838,0 24px 60px -24px #000,inset 0 2px 0 rgba(255,255,255,.06),inset 0 -3px 0 rgba(0,0,0,.5)}
.glass{position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;background:#000}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.7),inset 0 0 70px rgba(0,0,0,.6);
  background:linear-gradient(155deg,rgba(255,255,255,.05),transparent 32%)}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.deck{flex:0 0 auto;display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;
  font-size:8px;letter-spacing:.1em;color:#5F574F;line-height:1.6}
.deck b{color:#83769C;font-weight:400}
.modal{position:fixed;inset:0;background:rgba(4,4,10,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal .box{width:min(560px,100%);background:#0B0A14;border:2px solid #83769C;box-shadow:0 0 0 4px #000,0 0 40px rgba(131,118,156,.25);
  padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:12px;color:var(--ye);letter-spacing:.08em;font-weight:400}
.modal p{margin:0;font-size:9px;line-height:1.8;color:#C2C3C7}
.modal textarea{width:100%;min-height:92px;resize:vertical;background:#000;color:#29ADFF;border:1px solid #5F574F;
  font-family:inherit;font-size:9px;line-height:1.7;padding:10px;word-break:break-all;user-select:text;-webkit-user-select:text}
.modal textarea:focus{outline:2px solid #29ADFF;outline-offset:1px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap}
.modal button{font-family:inherit;font-size:9px;letter-spacing:.06em;padding:9px 12px;background:#000;color:#FFF1E8;
  border:2px solid #FFF1E8;cursor:pointer}
.modal button.pri{background:#FFEC27;color:#000;border-color:#FFEC27}
.modal button:focus-visible{outline:2px solid #29ADFF;outline-offset:2px}
.modal .msg{font-size:9px;min-height:12px;color:#00E436;line-height:1.6}
.modal .msg.bad{color:#FF004D}
@media (max-width:640px){.bezel{padding:8px;border-radius:14px}.glass{border-radius:9px}.deck{display:none}}
body.app{background:#000}
body.app .cab{padding:0;gap:0}
body.app .bezel{padding:0;border-radius:0;box-shadow:none;background:#000;max-width:none}
body.app .glass{border-radius:0}
body.app .glass::after{border-radius:0;box-shadow:inset 0 0 90px rgba(0,0,0,.55)}
body.app .deck{display:none}
#tui{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#rotate{display:none;position:fixed;inset:0;z-index:9;background:#05060C;color:#FFF1E8;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#rotate p{margin:0;font-size:12px;letter-spacing:.08em;color:#FFEC27;line-height:1.8}
#rotate small{font-size:8px;color:#83769C;letter-spacing:.1em}
/* phones and tablets: the whole screen is the cabinet */
body.touch{background:#000;position:fixed;inset:0;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.touch .cab{height:100vh;height:100dvh;padding:0;gap:0}
body.touch .bezel{padding:0;border-radius:0;box-shadow:none;background:#000;max-width:none}
body.touch .glass{border-radius:0}
body.touch .glass::after{border-radius:0;box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
body.touch .deck{display:none}
body.touch .modal{align-items:flex-start;padding-top:max(16px,env(safe-area-inset-top))}
body.touch .modal textarea{font-size:16px;min-height:64px}
@media (orientation:portrait) and (pointer:coarse) and (max-width:760px){#rotate{display:flex}}

    if (f.born > 1.5) { f.x = clamp(f.x, AX0 + 6, AX1 - 6); f.y = clamp(f.y, AY0 + 6, AY1 - 6); }
    if (!stunned) foeDefense(f, base, p, dist, dt * fsl);
    if (!G.foes.includes(f)) continue;

    if (!stunned && f.type !== "rusher" && f.born > (base.boss ? 1.4 : 0.6) && !G.over) foeFire(f, dt * fsl, diff);
    // BATTERING RAM: dashing through something hurts it
    if (S.ram && p.dashT > 0 && G.mode !== "attract" && f.ramId !== G.dashes && Math.hypot(p.x - f.x, p.y - f.y) < f.r + 9 && !f.dormant) {
      f.ramId = G.dashes; burst(f.x, f.y, 10, C.li, 90, 0.3); G.shake = Math.min(5, G.shake + 2); sfx.clank();
      if (damageFoe(f, S.ram + (S.juggernaut ? 1 : 0), 1)) continue;
    }

    if (G.mode !== "attract" && p.inv <= 0 && !G.over && dist < f.r + p.r) {
      hurt();
      if (f.type === "rusher" || f.type === "hollow") { burst(f.x, f.y, 16, f.type === "hollow" ? C.gy : C.rd, 96, 0.5); G.foes.splice(i, 1); continue; }
    }
  }

  cornerHazard(p, dt);

  /* ---- coins ---- */
  for (let i = G.coins.length - 1; i >= 0; i--) {
    const c = G.coins[i];
    c.t += dt;
    if (c.t < 0.35) {
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.vx *= Math.pow(0.02, dt); c.vy *= Math.pow(0.02, dt);
    } else {
      const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy) || 1;
      const s = 60 + c.t * 340;
      c.x += dx / d * s * dt; c.y += dy / d * s * dt;
      if (d < 5) { G.coinsGot++; G.coins.splice(i, 1); sfx.coin(); }
    }
  }

  /* ---- drops (arcade) ---- */
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i];
    d.life -= dt; d.spin += dt * 2.2;
    d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= Math.pow(0.25, dt); d.vy *= Math.pow(0.25, dt);
    d.x = clamp(d.x, AX0 + 6, AX1 - 6); d.y = clamp(d.y, AY0 + 6, AY1 - 6);
    if (d.life <= 0) { G.drops.splice(i, 1); continue; }
    if (G.mode === "arcade" && Math.hypot(d.x - p.x, d.y - p.y) < 9) { takeDrop(d); G.drops.splice(i, 1); }
  }

  /* ---- bullets ---- */
  const arc = curArc();
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    if (!b) continue;   // a hit can clear several shots at once
    b.life -= dt;
    if (b.life <= 0) { G.bullets.splice(i, 1); continue; }
    if (b.friend && b.seek > 0) {
      b.seek -= dt;
      let tgt = null, td = 208;
      for (const f of G.foes) { const d = Math.hypot(f.x - b.x, f.y - b.y); if (d < td) { td = d; tgt = f; } }
      if (tgt) {
        let ba = Math.atan2(b.vy, b.vx);
        const da = ((Math.atan2(tgt.y - b.y, tgt.x - b.x) - ba + Math.PI * 3) % TAU) - Math.PI;
        ba += clamp(da, -S.seekTurn * dt, S.seekTurn * dt);
        const bs = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(ba) * bs; b.vy = Math.sin(ba) * bs;
      }
    }
    if (!b.friend && S.gravity && !G.over) gravityBend(b, dt);
    const bs = (!b.friend && slowed) ? 0.45 : 1;
    b.x += b.vx * dt * bs; b.y += b.vy * dt * bs;
    if (b.friend) b.dist = (b.dist || 0) + Math.hypot(b.vx, b.vy) * dt;

    if (b.x < AX0 + 2 || b.x > AX1 - 2 || b.y < AY0 + 2 || b.y > AY1 - 2) {
      if (b.friend && b.bounce > 0) {
        b.bounce--;
        if (b.x < AX0 + 2 || b.x > AX1 - 2) { b.vx *= -1; b.x = clamp(b.x, AX0 + 2, AX1 - 2); }
        if (b.y < AY0 + 2 || b.y > AY1 - 2) { b.vy *= -1; b.y = clamp(b.y, AY0 + 2, AY1 - 2); }
        burst(b.x, b.y, 3, C.bl, 36, 0.3);
        if (S.storm) stormZap(b);
      } else { G.bullets.splice(i, 1); continue; }
    }

    if (!b.friend) {
      if (G.over) continue;
      if (S.sat && satBlock(b)) { G.bullets.splice(i, 1); continue; }
      if (G.decoys.length && decoyCatch(b)) continue;
      const pdx = b.x - p.x, pdy = b.y - p.y, pd = Math.hypot(pdx, pdy);
      if (pd > S.bandIn && pd < S.bandOut && (pdx * b.vx + pdy * b.vy) < 0) {
        const ang = Math.atan2(pdy, pdx);
        if (angDiff(ang, p.aim) < arc || (S.twin && angDiff(ang, p.aim + Math.PI) < arc * 0.8) || p.whirlT > 0) {
          parry(b, ang, S.perfectAll || pd <= S.perfectD); continue;
        }
      }
      if (pd < p.r + b.r && b.phantom) { G.bullets.splice(i, 1); burst(b.x, b.y, 6, C.pl, 60, 0.3); whisper("MISSED ME", {x: p.x, y: p.y - 22, life: 1.4}); continue; }
      if (G.mode !== "attract" && p.inv <= 0 && pd < p.r + b.r) { G.bullets.splice(i, 1); hurt(); continue; }
    } else {
      for (let j = G.foes.length - 1; j >= 0; j--) {
        const f = G.foes[j];
        if (Math.hypot(b.x - f.x, b.y - f.y) >= f.r + b.r) continue;
        const hitAng = Math.atan2(b.y - f.y, b.x - f.x);
        if ((f.type === "echo" || ((f.type === "milo" || f.type === "unit0417") && !(f.guardT > 0))) && f.born > 1.4 && angDiff(hitAng, f.shAng) < 1.0) {
          // ECHO returns your shot
          b.friend = false;
          const a = Math.atan2(p.y - f.y, p.x - f.x) + (rand() - 0.5) * 0.18;
          const s = Math.min(Math.hypot(b.vx, b.vy) * 1.1, 290);
          b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
          b.x = f.x + Math.cos(a) * (f.r + 8); b.y = f.y + Math.sin(a) * (f.r + 8);
          b.rally++; b.life = 6; b.fast = true; b.r = 2; b.seek = 0;
          floatTxt(f.x, f.y - 14, f.type === "milo" ? "HE CATCHES IT" : f.type === "unit0417" ? "IT CATCHES IT" : b.rally > 2 ? "RALLY " + b.rally : "RETURNED", f.type === "milo" ? C.lg : f.type === "unit0417" ? C.bl : C.pk);
          burst(b.x, b.y, 8, C.pk, 90, 0.3); sfx.clank();
          break;
        }
        if (f.type === "mirror" && f.born > 0.6 && !S.phase && angDiff(hitAng, f.shAng) < 0.7) {
          b.friend = false;
          const a = Math.atan2(p.y - f.y, p.x - f.x) + (rand() - 0.5) * 0.3;
          const s = Math.min(Math.hypot(b.vx, b.vy) * 0.9, 230);
          b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
          b.x = f.x + Math.cos(a) * (f.r + 7); b.y = f.y + Math.sin(a) * (f.r + 7);
          b.rally++; b.life = 6; b.r = 2; b.seek = 0;
          floatTxt(f.x, f.y - 12, "MIRRORED", C.la);
          burst(b.x, b.y, 6, C.la, 80, 0.3); sfx.clank();
          break;
        }
        if (plateBlocks(f, hitAng) || isShielded(f)) {
          const s = Math.hypot(b.vx, b.vy) * 0.82;
          b.vx = Math.cos(hitAng) * s; b.vy = Math.sin(hitAng) * s;
          b.x = f.x + Math.cos(hitAng) * (f.r + b.r + 6); b.y = f.y + Math.sin(hitAng) * (f.r + b.r + 6);
          b.seek = 0; b.bounce = Math.max(b.bounce, 1);
          burst(b.x, b.y, 6, C.or, 72, 0.3); sfx.clank();
          break;
        }
        burst(b.x, b.y, 5, C.bl, 64, 0.3);
        const dmg = 1 + (b.rally >= 2 ? 1 : 0) + (b.perfect && S.glassCannon ? 1 : 0) + (b.nova ? 0 : modDamage(b, f));
        f.hp -= dmg; f.hit = 0.12;
        if (S.cold && f.hp > 0) f.slowT = Math.max(f.slowT || 0, S.cold);
        if (f.hp <= 0) {
          b.chain++;
          killFoe(f, j, b.chain);
          if (S.nova && !b.nova) novaBurst(f.x, f.y);
          b.vx *= 0.82; b.vy *= 0.82; b.seek = 0.25;
        } else {
          if (b.pierce > 0) { b.pierce--; b.vx *= 0.7; b.vy *= 0.7; b.seek = 0.3; }
          else G.bullets.splice(i, 1);
          G.shake = Math.min(4, G.shake + 1); sfx.kill();
        }
        break;
      }
    }
  }

  for (let i = G.zaps.length - 1; i >= 0; i--) { G.zaps[i].t -= dt; if (G.zaps[i].t <= 0) G.zaps.splice(i, 1); }
  if (G.comboT > 0) { G.comboT -= dt / (1 + 0.5 * S.momentum); if (G.comboT <= 0) G.combo = 1; }
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i];
    q.life -= dt;
    if (q.life <= 0) { G.parts.splice(i, 1); continue; }
    if (!q.ring) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.pow(0.12, dt); q.vy *= Math.pow(0.12, dt); }
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i]; f.life -= dt; f.y -= 14 * dt;
    if (f.life <= 0) G.floats.splice(i, 1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 18);

  const nb = G.mode !== "attract" && !G.over ? nearestHostile(30 + 10 * S.reflex) : null;
  const want = G.over ? (G.won ? 1 : 0.45) : nb ? Math.max(0.3, 0.55 - 0.1 * S.reflex) : 1;
  G.ts += (want - G.ts) * Math.min(1, dt * 14);

  if (G.over) { G.endT -= dt; if (G.endT <= 0) G.ended = true; }
}

function foeFire(f, dt, diff) {
  const p = G.p;
  if (f.dormant) return;
  f.cd -= dt * (G.fireMul || 1);
  const aim = Math.atan2(p.y - f.y, p.x - f.x);
  const el = f.elite ? 1.25 : 1;
  if (f.type === "sniper" && f.cd < 0.8 && f.cd > 0 && f.tele <= 0) f.tele = 0.001;
  if (f.tele > 0) f.tele += dt;

  if (f.type === "furnace") {
    // spiral bursts, then a breather that spits out rushers
    if (f.burst > 0) {
      f.burst -= dt;
      if (f.cd <= 0) {
        f.cd = 0.12 / diff;
        if (f.p2) {
          // three arms, and the spin flips every burst
          f.spin += 0.3 * (f.stage2 % 2 ? -1 : 1);
          for (let k = 0; k < 3; k++) fire(f, f.spin + k * TAU / 3, 74 * diff, 1.5);
        } else {
          f.spin += 0.36;
          fire(f, f.spin, 70 * diff, 1.5); fire(f, f.spin + Math.PI, 70 * diff, 1.5);
        }
        if (f.stage % 4 === 0) sfx.shoot();
        f.stage++;
      }
    } else {
      if (f.cd <= -1.8) {
        f.burst = f.p2 ? 3.2 : 2.6; f.cd = 0; f.stage2 = (f.stage2 || 0) + 1;
        if (G.foes.filter(o => o.type === "rusher").length < 3) spawnFoe("rusher", {x: f.x, y: f.y + 16});
      }
    }
    return;
  }
  if (f.cd > 0) return;
  f.flashT = 0.3;
  const base = FOE[f.type];
  f.cd = base.cd / diff / el * (0.85 + rand() * 0.3);
  f.tele = 0;
  switch (f.type) {
    case "sentry": case "shard": fire(f, aim, 86 * diff * el, 1.5); sfx.shoot(); break;
    case "spreader": case "splitter": for (let j = -1; j <= 1; j++) fire(f, aim + j * 0.26, 74 * diff * el, 1.5); sfx.shoot(); break;
    case "sniper": fire(f, aim, 224 * diff, 1.5, true); sfx.snipe(); break;
    case "armor": for (const j of [-1, 1]) fire(f, aim + j * 0.13, 80 * diff * el, 1.5); sfx.shoot(); break;
    case "warden":
      f.stage = (f.stage + 1) % 3;
      if (f.stage === 0) { const n = f.p2 ? 18 : 14; for (let j = 0; j < n; j++) fire(f, j / n * TAU + f.plate, 66 * diff, 2); }
      else { const w = f.p2 ? 3 : 2; for (let j = -w; j <= w; j++) fire(f, aim + j * 0.17, 94 * diff, 2); }
      if (f.p2) f.cd *= 0.8;
      sfx.shoot();
      if (!f.summoned && f.hp <= f.maxhp / 2) { f.summoned = true; spawnFoe("sentry"); spawnFoe("sniper"); floatTxt(f.x, f.y - 20, "REINFORCE", C.or); }
      break;
    case "hydra": {
      const st = f.hp <= f.maxhp * 0.33 ? 2 : f.hp <= f.maxhp * 0.66 ? 1 : 0;
      if (st > f.summoned) {
        f.summoned = st;
        for (const k of [-1, 1]) spawnFoe("splitter", {x: f.x + k * 18, y: f.y + 6});
        if (st === 2) for (const k of [-1, 1]) spawnFoe("shard", {x: f.x, y: f.y + k * 16});
        floatTxt(f.x, f.y - 20, "IT SPLITS", C.li); G.shake = 4;
      }
      f.stage++;
      if (f.stage % 3 === 0) {
        for (let j = 0; j < 12; j++) fire(f, j / 12 * TAU + f.stage * 0.2, 62 * diff, 2);
        for (let j = 0; j < 12; j++) fire(f, (j + 0.5) / 12 * TAU + f.stage * 0.2, 50 * diff, 2);
      } else {
        const way = f.p2 ? [-2, -1, 0, 1, 2] : [-1, 0, 1], hs = f.p2 ? 1.2 : 1, g0 = G;
        for (let k = 0; k < 3; k++) setTimeout(() => { if (G === g0 && G.foes.includes(f) && !G.over && !G.paused) { for (const j of way) fire(f, Math.atan2(G.p.y - f.y, G.p.x - f.x) + j * 0.2, 90 * diff * hs, 1.5); } }, k * 140);
      }
      f.cd = base.cd / diff * (st === 2 ? 0.7 : 1);
      sfx.shoot();
      break;
    }
    case "shielder": fire(f, aim, 70 * diff * el, 1.5); sfx.shoot(); break;
    case "mirror": for (const j of [-0.08, 0.08]) fire(f, aim + j, 96 * diff * el, 1.5); sfx.shoot(); break;
    case "miner":
      if (G.foes.filter(o => o.type === "mine").length < 4) {
        const m = spawnFoe("mine", {x: f.x, y: f.y}); m.born = 0.3;
        tone(240, 0.06, "square", 0.08, 120);
      } else { fire(f, aim, 80 * diff * el, 1.5); sfx.shoot(); }
      break;
    case "mimic": for (const j of [-0.12, 0.12]) fire(f, aim + j, 84 * diff, 1.5); sfx.shoot(); break;
    case "milo": {
      f.stage++;
      if (f.p2) {
        fire(f, aim, 130 * diff, 2, true);
        fire(f, Math.PI - aim, 100 * diff, 1.5);
        if (f.stage % 4 === 0) for (let j = 0; j < 14; j++) fire(f, j / 14 * TAU + f.stage, 58 * diff, 2);
      } else if (f.stage % 3 === 0) { for (let j = -2; j <= 2; j++) fire(f, aim + j * 0.2, 100 * diff, 1.5); }
      else fire(f, aim, 150 * diff, 2, true);
      f.guardT = 1.15;   // he lowers his shield to shoot
      f.cd = base.cd / diff * (f.p2 ? 0.8 : 1);
      sfx.snipe();
      break;
    }
    case "unit0417": unitFire(f, diff); break;
    case "echo":
      f.stage++;
      if (f.hp < f.maxhp / 2 && f.stage % 3 === 0) for (let j = 0; j < 10; j++) fire(f, j / 10 * TAU + f.stage, 70, 2);
      else if (f.stage % 2) fire(f, aim, 140, 2, true);
      else for (const j of [-1, 0, 1]) fire(f, aim + j * 0.22, 100, 1.5);
      sfx.snipe();
      break;
  }
}

function drawArenaBg(pal) {
  R(0, 0, W, H, pal.bg);
  L.fillStyle = pal.grid;
  for (let x = AX0 + 8; x < AX1; x += 16) for (let y = AY0 + 8; y < AY1; y += 16) L.fillRect(x, y, 1, 1);
  RO(AX0, AY0, AX1 - AX0, AY1 - AY0, pal.grid);
  // corner brackets in the wall colour
  const c = pal.wall;
  for (const [x, y, sx, sy] of [[AX0, AY0, 1, 1], [AX1 - 1, AY0, -1, 1], [AX0, AY1 - 1, 1, -1], [AX1 - 1, AY1 - 1, -1, -1]]) {
    R(Math.min(x, x + sx * 6), y, 7, 1, c); R(x, Math.min(y, y + sy * 6), 1, 7, c);
  }
}

function drawFoe(f) {
  const base = FOE[f.type], fl = f.hit > 0;
  const appear = Math.min(1, f.born * 3);
  if (appear < 1 && Math.floor(f.born * 20) % 2) return;
  if (f.type === "warden") {
    disc(f.x, f.y, 10, fl ? C.wh : C.or); disc(f.x, f.y, 8, fl ? C.wh : C.ru);
    disc(f.x, f.y, 4, C.wh);
    R(f.x - 1 + Math.round(Math.cos(f.ang) * 2), f.y - 1 + Math.round(Math.sin(f.ang) * 2), 2, 2, C.nv);
    const np = f.p2 ? 6 : 3, ha = f.p2 ? 0.31 : 0.65;
    for (let i = 0; i < np; i++) { const a = f.plate + i * TAU / np; arcPx(f.x, f.y, 15, a - ha, a + ha, f.p2 ? C.or : C.ye, 2); }
  } else if (f.type === "furnace") {
    const hot = f.burst > 0;
    R(f.x - 11, f.y - 11, 22, 22, fl ? C.wh : C.ru);
    R(f.x - 10, f.y - 10, 20, 20, "#3B1A12");
    R(f.x - 6, f.y - 6, 3, 2, C.ye); R(f.x + 3, f.y - 6, 3, 2, C.ye);
    for (let k = 0; k < 3; k++) R(f.x - 7, f.y + 1 + k * 3, 14, 1, hot ? (k % 2 ? C.ye : C.or) : C.ru);
    arcPx(f.x, f.y, 17, f.plate - 1.3, f.plate + 1.3, f.p2 ? C.ye : C.or, 2);
    if (f.p2 && Math.floor(G.t * 10) % 2) RO(f.x - 12, f.y - 12, 24, 24, C.or);
  } else if (f.type === "hydra") {
    disc(f.x, f.y, 11, fl ? C.wh : C.li); disc(f.x, f.y, 9, fl ? C.wh : C.gr);
    for (const [ex, ey] of [[-5, -3], [0, -5], [5, -3]]) {
      R(f.x + ex - 1, f.y + ey - 1, 3, 3, C.wh);
      P(f.x + ex + Math.round(Math.cos(f.ang)), f.y + ey + Math.round(Math.sin(f.ang)), C.k);
    }
    R(f.x - 4, f.y + 4, 9, 1, C.k);
  } else if (f.type === "unit0417") {
    drawUnit0417(f, fl);
  } else if (f.type === "milo") {
    drawSpr(SPR.milo, f.x, f.y, fl, 2);
    const down = f.guardT > 0;
    if (!down || Math.floor(G.t * 10) % 3 === 0) arcPx(f.x, f.y, 14, f.shAng - 1.0, f.shAng + 1.0, down ? C.gy : (fl ? C.wh : C.lg), down ? 1 : 2);
  } else if (f.type === "mimic" && f.dormant) {
    drawSpr(Math.floor((G.t + f.x) * 8) % 2 ? SPR.coin : SPR.coin2, f.x, f.y);
  } else if (f.type === "hollow") {
    drawSpr(SPR.hollow, f.x + (f.seen ? 0 : (rand() - 0.5) * 1.2), f.y, fl);
  } else if (f.type === "echo") {
    drawSpr(SPR.echo, f.x, f.y, fl, 2);
    const col = fl ? C.wh : C.pk;
    arcPx(f.x, f.y, 14, f.shAng - 1.0, f.shAng + 1.0, col, 2);
  } else {
    const s = SPR[base.spr];
    if (f.elite) drawOutline(s, f.x, f.y);
    drawSpr(s, f.x, f.y, fl);
    if (f.type === "mirror") arcPx(f.x, f.y, 8, f.shAng - 0.7, f.shAng + 0.7, fl ? C.wh : C.lg, 1);
    if (f.type === "mine") {
      const k = f.fuse < 1.2 ? 16 : f.born < 0.8 ? 2 : 5;
      if (Math.floor(G.t * k) % 2) R(f.x - 1, f.y - 1, 2, 2, f.fuse < 1.2 ? C.wh : C.ye);
      if (f.fuse < 1.2) ringDots(f.x, f.y, 10 + (1.2 - f.fuse) * 6, C.rd, 4);
    }
    if (f.type === "sentry") R(f.x - 1 + Math.round(Math.cos(f.ang) * 1.5), f.y - 1 + Math.round(Math.sin(f.ang) * 1.5), 2, 2, C.nv);
    if (f.type === "armor") arcPx(f.x, f.y, 9, f.plate - 1.15, f.plate + 1.15, C.ye, 2);
    if (f.maxhp > 1) for (let k = 0; k < f.maxhp; k++) P(f.x - f.maxhp + 1 + k * 2, f.y + f.r + 3, k < f.hp ? C.wh : C.gy);
  }
  if (f.type === "sniper" && f.tele > 0 && Math.floor(f.tele * 14) % 2 === 0)
    line(f.x, f.y, f.x + Math.cos(f.ang) * 420, f.y + Math.sin(f.ang) * 420, C.pk, 3);
}

function drawBullet(b) {

      const y = 44 + (j + 0.5) * (168 / n) + (rr() - 0.5) * 10;
      const node = {id: l + "-" + j, layer: l, x: LX(l) + (rr() - 0.5) * 8, y: Math.round(y), type: "fight", next: [], secret: false, visited: false};
      layer.push(node); nodes.push(node);

    {fight:35, event:20, elite:20, treasure:15, shop:10, altar:8},
    {fight:40, elite:30, event:30, altar:10},

/* ---------------- fights ---------------- */
const RunFight = {
  enter(n) {
    this.node = n;
    const kind = n.type;
    if (n.layer == null) { const nd = nodeById(run.pendingId); n.layer = nd ? nd.layer : 2; }
    const waves = kind === "boss" ? [[BOSS_FOR[run.depth]]] : runWaves(run.depth, n.layer, kind);
    newCombat({mode: "run", pal: DEPTH_PAL[run.depth], S: runStats(), lives: run.lives, maxLives: run.maxLives,
      waves, diff: depthDiff(run.depth, n.layer), elite: kind === "elite" || run.depth === 4, runPerf: run.runPerf,
      onEnd: res => fightEnd(res, n)});
    G.leechK = run.leechK || 0;
    const cm = combatCurseMuls();
    G.bulletMul = cm.bullet; G.fireMul = cm.fire;
    G.touch = lastPointerTouch;
    G.dark = run.depth === 5;
    music(run.depth === 6 ? (kind === "boss" ? "unit" : "lantern") : run.depth === 5 ? (kind === "boss" ? "milo" : "basement") : kind === "boss" ? "boss" : run.depth === 4 ? "signal" : "fight");
    if (new Date().getHours() === 3) unlockAch("witching");
    if (G.dark && !(meta.flags && meta.flags.darkTip)) { if (!meta.flags) meta.flags = {}; meta.flags.darkTip = 1; setTimeout(() => toast("THE LIGHTS DON'T WORK DOWN HERE. SHOTS STILL GLOW.", C.lg), 600); }
    if (kind === "elite") banner("ELITE", C.or, 1.2);
  },
  update(dt) { combatTick(dt); },
  draw() {
    drawCombat();
    this.items = [];
    if (G.paused) drawPause(this, "ABANDON RUN", () => { run.lives = 0; go(RunOver, endRun("dead")); });
  },
  key(k) { return combatKey(this, k); }
};
function fightEnd(res, n) {
  run.lives = G.lives; run.maxLives = G.maxLives;
  run.kills += G.kills; run.perfects += G.perfects; run.runPerf = G.runPerf;
  run.coins += Math.round(G.coinsGot * G.S.coinMul) + (res.win ? (G.gradeBonus || 0) : 0);
  modsAfterFight(res.win);
  if (res.win && G.grade) { if (!run.grades) run.grades = {S: 0, A: 0, B: 0, C: 0}; run.grades[G.grade]++; }
  if (res.win && n.rescue) rescueNpc(n.rescue);
  meta.stats.kills += G.kills; meta.stats.perfects += G.perfects;
  if (!res.win) return go(RunOver, endRun("dead"));
  run.fights++;
  if (run.lantern) { meta.stats.lanternRooms = (meta.stats.lanternRooms || 0) + 1; checkLore(); }
  if ((G.moved || 0) < 120 && G.kills >= 4 && !(meta.flags && meta.flags.still)) { if (!meta.flags) meta.flags = {}; meta.flags.still = 1; }
  if (G.perfects >= 10 && !meta.shields.mirror) {
    meta.shields.mirror = true; meta.secrets.mirror = true; sfx.secret();
    toast("SECRET SHIELD UNLOCKED: MIRROR", C.pk);
  }
  if (n.type !== "boss" && G.hits === 0 && G.perfects >= 4) {
    const v = vaultNode();
    if (v && !v.visited && !vaultRevealed()) {
      run.revealed[run.depth] = true;
      toast(n.layer < v.layer ? "FLAWLESS. A HIDDEN PATH FLICKERS INTO VIEW." : "FLAWLESS. YOU SENSE A HIDDEN ROOM... BEHIND YOU.", C.pk);
    }
  }
  saveMeta(); checkTapes();
  run.bank += n.type === "elite" ? 20 : n.type === "boss" ? 50 : 10;
  if (n.type === "boss") {
    run.bosses++;
    if (G.hits === 0 && !meta.fragments[3]) grantFragment(3);
    const node = nodeById(run.pendingId); if (node) { node.visited = true; run.curId = node.id; }
    run.pendingId = null;
    checkTapes();
    return go(run.depth === 6 ? LanternEnding : run.depth === 5 ? MiloEnding : DepthClear);
  }
  go(RewardScene, {kind: n.type});
}

// o.slot: a mod you hold (shows its level); otherwise an offer (shows what taking it does)
function drawCard(sc, id, x, y, w, h, act, extra, o) {
  o = o || {};
  const m = MODS[id], col = o.armed ? C.rd : RAR_COL[m.r];
  const sel = btn(sc, null, x, y, w, h, act, {col, dim: col});

  drawCardFace(id, x, y, w, h, sel);
  let foot, fc = C.gy;
  if (o.slot) { foot = o.armed ? "DROP IT?" : "LEVEL " + ROMAN[modLv(id)]; fc = o.armed ? C.rd : C.lg; }
  else {
    const f = modFate(id);
    foot = f === "up" ? "LEVEL UP > " + ROMAN[modLv(id) + 1] : f === "max" ? "ALREADY MAXED" : f === "swap" ? "SLOTS FULL: SWAP" : "EMPTY SLOT";
    fc = f === "up" ? C.li : f === "swap" ? C.or : C.gy;
  }
  txt(foot, x + w / 2, y + h - 12, fc, 1, "c");
  if (extra) txt(extra, x + w / 2, y + h - 20, C.ye, 1, "c");
}

}

  return "RIPD-" + body + "-" + hash(body + "|daily").slice(-4);
}
function parseDailyCode(v) {
  const m = /^RIPD-(\d{8})-([A-Z0-9]{1,3})-(\d{1,9})-([A-Z0-9]{1,4})$/i.exec(v.replace(/\s+/g, ""));
  if (!m) return null;
  const body = m[1] + "-" + m[2].toUpperCase() + "-" + m[3];
  if (hash(body + "|daily").slice(-4) !== m[4].toUpperCase()) return {bad: true};
  return {date: m[1].slice(0, 4) + "-" + m[1].slice(4, 6) + "-" + m[1].slice(6), i: m[2].toUpperCase(), s: parseInt(m[3], 10)};
}

/* md5 (RFC 1321), only used to sign API calls */
function md5(str) {
  const s = unescape(encodeURIComponent(str));
  const k = [], r = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
  for (let i = 0; i < 64; i++) k[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
  const n = ((s.length + 8) >> 6) + 1, words = new Array(n * 16).fill(0);
  for (let i = 0; i < s.length; i++) words[i >> 2] |= s.charCodeAt(i) << ((i % 4) * 8);
  words[s.length >> 2] |= 0x80 << ((s.length % 4) * 8);
  words[n * 16 - 2] = s.length * 8;
  let a0 = 0x67452301, b0 = 0xefcdab89 | 0, c0 = 0x98badcfe | 0, d0 = 0x10325476;
  for (let blk = 0; blk < words.length; blk += 16) {
    let a = a0, b = b0, c = c0, d = d0;
    for (let i = 0; i < 64; i++) {
      let f, g;
      if (i < 16) { f = (b & c) | (~b & d); g = i; }
      else if (i < 32) { f = (d & b) | (~d & c); g = (5 * i + 1) % 16; }
      else if (i < 48) { f = b ^ c ^ d; g = (3 * i + 5) % 16; }
      else { f = c ^ (b | ~d); g = (7 * i) % 16; }
      const tmp = d; d = c; c = b;
      const x = (a + f + k[i] + words[blk + g]) | 0;
      const sh = r[(i >> 4) * 4 + (i % 4)];
      b = (b + ((x << sh) | (x >>> (32 - sh)))) | 0;
      a = tmp;
    }
    a0 = (a0 + a) | 0; b0 = (b0 + b) | 0; c0 = (c0 + c) | 0; d0 = (d0 + d) | 0;
  }
  let out = "";
  for (const v of [a0, b0, c0, d0]) for (let i = 0; i < 4; i++) out += ((v >>> (i * 8)) & 255).toString(16).padStart(2, "0");
  return out;
}

function gjCall(endpoint, params) {
  if (!gjReady()) return Promise.reject(new Error("not set up"));
  let url = "https://api.gamejolt.com/api/game/v1_2/" + endpoint + "/?game_id=" + encodeURIComponent(GJ.gameId);
  for (const k in params) if (params[k] !== undefined && params[k] !== "") url += "&" + k + "=" + encodeURIComponent(params[k]);
  url += "&signature=" + md5(url + GJ.key);
  return fetch(url).then(r => r.json()).then(j => {
    const res = j && j.response;
    if (!res || res.success !== "true" && res.success !== true) throw new Error((res && res.message) || "failed");
    return res;
  });
}

function gjFetchBoards(force) {
  if (!gjReady() || (!force && performance.now() - GJ.board.t < 60000)) return;
  GJ.board.t = performance.now(); GJ.board.status = "LOADING...";
  const jobs = [];
  GJ.board.hidden = 0;
  const take = (r, kind) => { const c = checkedRows(r.scores, kind); GJ.board.hidden += c.hidden; return c.rows; };
  if (GJ.tables.arcade) jobs.push(gjCall("scores", {table_id: GJ.tables.arcade, limit: 50}).then(r => { GJ.board.arcade = take(r, "arcade").slice(0, 10); }));
  if (GJ.tables.daily) jobs.push(gjCall("scores", {table_id: GJ.tables.daily, limit: 100}).then(r => { GJ.board.daily = take(r, "daily"); }));
  Promise.all(jobs).then(() => { GJ.board.status = ""; }).catch(() => { GJ.board.status = "COULDN'T REACH GAMEJOLT"; });
}
const gjFetchDaily = () => gjFetchBoards(false);
function gjDailyRows() {
  if (!GJ.board.daily) return null;

// when does each tape turn up in the back room (checked, so it works for old saves too)
function tapeEarned(i) {
  const st = meta.stats, a = meta.ach || {}, f = meta.flags || {};
  const own = meta.arcade.filter(e => !e.friend);
  switch (i) {
    case 1: return st.runs > 0 || st.kills > 0 || own.length > 0;
    case 2: return st.runs >= 3 || (st.bestWave || 0) >= 5 || own.some(e => (e.w || 0) >= 5);
    case 3: return !!f.demoSeen;
    case 4: return !!a.warden;
    case 5: return (meta.playTime || 0) >= 45 * 60 || !!f.lateNight;
    case 6: return !!a.furnace;
    case 7: return own.length >= 2 || !!f.initials;
    case 8: return !!a.vault;
    case 9: return !!meta.secrets.static;
    case 10: return !!a.hydra;

const TAPE_GAP = 6 * 60;     // seconds of play between tapes turning up
function checkTapes() {
  if (!meta.tapesDue) meta.tapesDue = {};

  // one tape at a time, with play in between: the story should outlast the first sitting
  const waited = (meta.playTime || 0) - (meta.flags.tapeAt || 0) >= TAPE_GAP;
  for (let i = 1; i <= TAPE_COUNT; i++) {
    if (meta.tapesDue[i] || tapeRead(i) || !tapeEarned(i)) continue;
    const last = i === TAPE_COUNT;                               // the last one is already gated behind all the others

    if (!last && !waited && tapesRead() >= 2) break;             // the first two come quickly, then it slows
    meta.tapesDue[i] = 1; fresh++;
    meta.flags.tapeAt = meta.playTime || 0;

    saveMeta();
    setTimeout(() => toast(fresh > 1 ? fresh + " TAPES WERE LEFT IN THE BACK ROOM." : "A TAPE WAS LEFT IN THE BACK ROOM.", C.pl), 700);
  }
  checkLore();

/* ---------------- enemy behaviour (called from the combat loop) ---------------- */
function hollowStep(f, p, dt, dx, dy, dist) {
  const ang = Math.atan2(f.y - p.y, f.x - p.x);
  f.seen = f.born > 0.5 && angDiff(ang, p.aim) < curArc() + 0.35;
  if (f.seen) { f.vx *= 0.15; f.vy *= 0.15; return; }
  const s = FOE.hollow.spd * G.diff * (f.elite ? 1.15 : 1);
  f.vx = dx / dist * s; f.vy = dy / dist * s;
  if (G.mode !== "attract" && G.t - (G.creakT || 0) > 0.4) { G.creakT = G.t; noise(0.09, 0.035, 260 + rand() * 80, 140); }
}
function wakeMimic(f) {
  f.dormant = false; f.hit = 0.15; f.cd = 1.4;
  const off = rand() * TAU;
  for (let k = 0; k < 10; k++) fire(f, off + k / 10 * TAU, 62 * G.diff, 1.5);
  burst(f.x, f.y, 10, C.or, 80, 0.35);
  floatTxt(f.x, f.y - 10, "!", C.rd);
  tone(900, 0.06, "square", 0.1, 200); noise(0.15, 0.12, 1200, 400);
  G.shake = Math.min(5, G.shake + 2);
}
function mimicStep(f, p, dt, dist) {
  f.vx = f.vy = 0;
  if (G.foes.every(o => o.dormant)) f.idleT = (f.idleT || 0) + dt;
  if (f.born > 0.5 && (dist < 34 || f.hit > 0 || f.idleT > 4)) wakeMimic(f);
}
function miloStep(f, p, dt) {
  if (f.guardT > 0) f.guardT -= dt;
  if (f.born < 1.4 || G.over) return;
  f.lights = (f.lights == null ? 7 : f.lights) - dt;
  if (f.lights <= 0) {
    f.lights = f.p2 ? 7 + rand() * 2 : 9 + rand() * 3;
    G.lightsOut = 2.6;
    floatTxt(p.x, p.y - 18, "LIGHTS OUT", C.rd);
    tone(70, 0.4, "square", 0.1, 40); noise(0.3, 0.1, 600, 100);
    if (rand() < 0.4) whisper(pick(["BEHIND YOU", "OVER HERE", "I CAN SEE YOU", "AGAIN"]));
  }
}

/* ---------------- darkness ---------------- */
let darkCv = null, darkX = null;
function drawDarkness() {
  if (!darkCv) { darkCv = document.createElement("canvas"); darkCv.width = W * RS; darkCv.height = H * RS; darkX = darkCv.getContext("2d"); }
  const d = darkX, p = G.p;
  d.globalCompositeOperation = "source-over";
  d.clearRect(0, 0, darkCv.width, darkCv.height);
  d.fillStyle = "rgba(3,1,4,0.965)";
  d.fillRect(0, 0, darkCv.width, darkCv.height);
  d.globalCompositeOperation = "destination-out";
  const light = (x, y, r, a) => {
    const g = d.createRadialGradient(x * RS, y * RS, 0, x * RS, y * RS, r * RS);
    g.addColorStop(0, "rgba(0,0,0," + a + ")"); g.addColorStop(0.55, "rgba(0,0,0," + (a * 0.7) + ")"); g.addColorStop(1, "rgba(0,0,0,0)");
    d.fillStyle = g; d.beginPath(); d.arc(x * RS, y * RS, r * RS, 0, TAU); d.fill();
  };
  const out = G.lightsOut > 0;
  const flick = rand() < 0.015 ? 0.6 : 1;
  if (!(G.over && !G.won)) light(p.x, p.y, (out ? 24 : 66 + Math.sin(G.t * 9) * 2) * flick, 1);
  for (const b of G.bullets) light(b.x, b.y, b.friend ? 13 : 10, 0.9);
  for (const c of G.coins) light(c.x, c.y, 7, 0.6);
  for (const f of G.foes) {
    if (f.dormant) light(f.x, f.y, 7, 0.6);
    else if (f.type === "milo") light(f.x, f.y, out ? 0 : 22, 0.55);
    else if (f.flashT > 0 || f.hit > 0) light(f.x, f.y, 16, 0.75);
  }
  for (const q of G.parts) if (!q.ring && rand() < 0.25) light(q.x, q.y, 4, 0.4);
  L.save(); L.setTransform(1, 0, 0, 1, 0, 0); L.globalAlpha = 1; L.drawImage(darkCv, 0, 0); L.restore();
  // eyes in the dark
  for (const f of G.foes) {
    if (f.type === "hollow" && f.born > 0.4) {
      const col = f.seen ? C.wh : C.rd;
      L.globalAlpha = 0.65 + rand() * 0.3;
      P(f.x - 1, f.y - 4, col); P(f.x + 1, f.y - 4, col);
      L.globalAlpha = 1;
    } else if (f.type === "milo" && out) { P(f.x - 1, f.y - 1, C.rd); P(f.x + 1, f.y - 1, C.rd); }
  }
}

/* ================================================================
   Players: every player picks a name once, their best arcade score
   goes to GameJolt by itself (guests too), and a shared PLAYERS list
   (GameJolt's data store) shows who plays and how much.
   ================================================================ */
const NAME_MAX = 12;
const NAME_ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
function cleanName(s) {
  return normText(String(s || "")).replace(/[^A-Z0-9 ]/g, "").replace(/\s+/g, " ").trim().slice(0, NAME_MAX).trim();
}
// the cabinet's own top 10 (and the share codes) keep classic 1-3 letter initials, taken from the name
function nameInitials(n) { return cleanName(n).replace(/[^A-Z0-9]/g, "").slice(0, 3) || "AAA"; }
function myName() { return meta.name || meta.initials || "PLAYER"; }
// one name is already in use, and always will be
const nameTaken = n => ["MILO", "MLO"].includes(cleanName(n).replace(/ /g, ""));
function takenGlitch() {
  sfx.deny(); fxGlitch(0.7); sfxGlitch(true);
  if (hauntMode() > 0) { tone(41, 1, "sine", 0.18); setTimeout(() => whisper("MINE"), 400); }
  loreSetFlag("nameTaken");
}

// one-time setup for this save: a hidden id so two players with the same name stay apart
(function playersInit() {
  if (!meta.flags) meta.flags = {};
  let dirty = false;
  if (!meta.pid) { meta.pid = Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 8); dirty = true; }
  if (!meta.flags.pl1) {
    meta.flags.pl1 = 1; dirty = true;
    meta.stats.activeTime = Math.max(meta.stats.activeTime || 0, Math.round(meta.playTime || 0));
    const best = (meta.arcade || []).filter(e => !e.friend && !e.ghost).sort((a, b) => b.s - a.s)[0];
    if (best && best.s > (meta.stats.bestScore || 0)) { meta.stats.bestScore = best.s; meta.stats.bestScoreWave = best.w || 0; }
  }
  if (dirty) saveMeta();
})();

    .then(r => r.json()).then(j => {
      const res = j && j.response;
      if (!res || String(res.success) !== "true") throw new Error((res && res.message) || "failed");
      return res;
    });
}

// back this device's save up into its own slot (merge: also count past every save it has been shown)
function cloudUpload(keepalive, merge) {
  const u = gjUser();
  if (!u || CLOUD.busy || CLOUD.conflict || !CLOUD.checked) return Promise.resolve(false);
  const mine = cloudMine(), vv = vvMax(mine.vv, merge ? CLOUD.seen : null);
  vv[DEVICE_ID] = (vv[DEVICE_ID] | 0) + 1;
  const m = {};
  for (const k in meta) if (!CLOUD_LOCAL[k]) m[k] = meta[k];
  let r = null; try { r = JSON.parse(runText() || "null"); } catch (e) {}
  const fp = cloudFingerprint(meta, runText());
  const body = JSON.stringify({v: VERSION, vv, t: Date.now(), device: DEVICE_ID, dev: deviceLabel(), saved: meta.saveT || Date.now(), meta: m, run: r});
  CLOUD.busy = true; CLOUD.lastUp = T;
  return gjPost("data-store/set", {key: slotKey(), username: u.user, user_token: u.token}, body, keepalive && body.length < 60000)
    .then(() => {
      meta.cloud = {user: cloudUserKey(), vv, fp, play: meta.playTime || 0};
      CLOUD.seen = vvMax(CLOUD.seen, vv);
      CLOUD.syncedAt = Date.now(); CLOUD.changed = false; CLOUD.status = "";
      saveMeta();
      return true;
    })
    .catch(() => { CLOUD.status = "COULDN'T BACK UP TO GAMEJOLT, WILL TRY AGAIN"; return false; })
    .then(ok => { CLOUD.busy = false; return ok; });
}

// a save with nothing in it yet (a new device) gives way without asking
function freshSave(m) {
  return !(m.stats && (m.stats.runs || m.stats.arcadeGames || m.stats.kills)) && !Object.keys(m.ach || {}).length && !m.earned;
}
// every slot on this account (this device's own included)
function cloudSlots(u) {
  const auth = {username: u.user, user_token: u.token};
  return gjCall("data-store/get-keys", Object.assign({pattern: "save-*"}, auth)).then(r => {
    const keys = (Array.isArray(r.keys) ? r.keys : []).map(k => k.key).filter(Boolean).slice(0, 25);
    if (!keys.length) return [];
    return gjBatch(keys.map(k => ["data-store", Object.assign({key: k}, auth)])).then(rs => rs.map(x => {
      try { return x && String(x.success) === "true" ? JSON.parse(x.data) : null; } catch (e) { return null; }
    }).filter(c => c && c.meta && c.vv));
  });
}
function cloudCheck() {
  const u = gjUser();
  if (!u || !gjReady() || CLOUD.busy) return;
  CLOUD.busy = true; CLOUD.checkT = T;
  if (!CLOUD.checked) CLOUD.status = "CHECKING YOUR GAMEJOLT SAVE...";
  cloudSlots(u).then(slots => {
    CLOUD.busy = false; CLOUD.checked = true; CLOUD.status = "";
    const mine = cloudMine(), own = slots.find(c => c.device === DEVICE_ID), others = slots.filter(c => c.device !== DEVICE_ID);
    for (const c of slots) CLOUD.seen = vvMax(CLOUD.seen, c.vv);
    CLOUD.ownVV = own ? own.vv : {};
    const byTime = (a, b) => b.t - a.t;
    const split = others.filter(c => vvCmp(c.vv, mine.vv) === 2).sort(byTime);
    const newer = others.filter(c => vvCmp(c.vv, mine.vv) === 1).sort(byTime);
    if (split.length) { CLOUD.conflict = split[0]; return; }                         // two devices went their own ways
    if (newer.length) { if (cloudDirty()) CLOUD.conflict = newer[0]; else CLOUD.adopt = newer[0]; return; }
    if (cloudDirty() || !own || mine.push) cloudUpload(false, !!mine.push);          // we're the newest: make sure our slot says so
    else CLOUD.syncedAt = Date.now();
  }).catch(() => { CLOUD.busy = false; CLOUD.status = "COULDN'T REACH GAMEJOLT FOR YOUR SAVE"; });
}

function cloudAdopt(c) {
  try {
    const m = mergeDeep(freshMeta(), JSON.parse(JSON.stringify(c.meta)));
    m.gj = meta.gj; m.settings = meta.settings; m.sent = meta.sent || {};
    const runStr = c.run ? JSON.stringify(c.run) : "";
    // this device's slot gets rewritten with the loaded save on the next start (push), counted past everything seen
    m.cloud = {user: cloudUserKey(), vv: vvMax(c.vv, CLOUD.ownVV), fp: cloudFingerprint(m, runStr), play: m.playTime || 0, push: 1};
    NO_SAVE = true;                                  // nothing may write the old save back over it now
    localStorage.setItem(SAVE_KEY, JSON.stringify(m));
    if (runStr) localStorage.setItem(RUN_KEY, runStr); else localStorage.removeItem(RUN_KEY);
    if (meta.pid && m.pid && meta.pid !== m.pid) sessionStorage.setItem("riposte.oldpid", meta.pid);
    sessionStorage.setItem("riposte.cloudmsg", "SAVE LOADED FROM GAMEJOLT (" + (c.dev || "ANOTHER DEVICE") + ")");
    sessionStorage.setItem("riposte.resume", scene === HubScene || hubReturn ? "hub" : "title");
    location.reload();
  } catch (e) { NO_SAVE = false; toast("COULDN'T LOAD THE GAMEJOLT SAVE", C.rd); }
}

const cloudCalm = () => !modalOpen && [TitleScene, HubScene, OnlineScene, RecordsScene, ModesScene].includes(scene);
function cloudTick() {
  if (!gjUser() || !gjReady()) {
    if (CLOUD.checked || CLOUD.conflict) Object.assign(CLOUD, {checked: false, conflict: null, adopt: null, status: "", syncedAt: 0});
    return;
  }
  if (!CLOUD.checked) {
    if (!CLOUD.busy && T - CLOUD.tryT > 30 && scene !== BootScene && scene !== NameScene) { CLOUD.tryT = T; cloudCheck(); }
    return;
  }
  if (CLOUD.adopt && cloudCalm()) { const c = CLOUD.adopt; CLOUD.adopt = null; cloudAdopt(c); return; }
  if (CLOUD.conflict) { if (!CLOUD.snooze && cloudCalm() && scene !== CloudScene) go(CloudScene, {c: CLOUD.conflict, back: scene}); return; }
  // someone else on this account may be playing too: look again now and then, between games
  if (T - CLOUD.checkT > 600 && cloudCalm() && !CLOUD.busy) { cloudCheck(); return; }
  // keep the copy on GameJolt fresh: progress goes up within half a minute (play time rides along with it)
  if (T - CLOUD.fpT > 5) { CLOUD.fpT = T; CLOUD.changed = cloudDirty(); }
  if (CLOUD.changed && T - CLOUD.lastUp > 20) cloudUpload();
}
function cloudFlush() { if (gjUser() && CLOUD.checked && !CLOUD.conflict && !CLOUD.busy && cloudDirty()) cloudUpload(true); }
function cloudReset() { Object.assign(CLOUD, {checked: false, busy: false, tryT: -99, conflict: null, adopt: null, status: "", syncedAt: 0, snooze: false, seen: {}}); }

function cloudStatus() {
  if (!gjUser()) return "LOG IN TO KEEP YOUR SAVE ON GAMEJOLT TOO";
  if (CLOUD.status) return CLOUD.status;
  if (CLOUD.conflict) return "TWO DIFFERENT SAVES: CHOOSE ONE FROM THE TITLE SCREEN";
  if (!CLOUD.syncedAt) return "CLOUD SAVE: ON";
  const m = Math.floor((Date.now() - CLOUD.syncedAt) / 60000);
  return "SAVE BACKED UP TO GAMEJOLT " + (m < 1 ? "JUST NOW" : m + (m === 1 ? " MINUTE" : " MINUTES") + " AGO");
}

// after loading another device's save: say so, and tidy up this device's old player entry
(function cloudAfterReload() {
  try {
    const msg = sessionStorage.getItem("riposte.cloudmsg"), old = sessionStorage.getItem("riposte.oldpid");
    sessionStorage.removeItem("riposte.cloudmsg"); sessionStorage.removeItem("riposte.oldpid");
    if (msg) setTimeout(() => toast(msg, C.li), 900);
    if (msg) { CLOUD.checked = true; CLOUD.syncedAt = Date.now(); }
    if (old && gjReady()) setTimeout(() => gjCall("data-store/remove", {key: "p_" + old}).catch(() => {}), 3000);
  } catch (e) {}
})();

const DIFFS = [

function fightDiff(mode) {

const DLV = () => DIFFS[G && G.dl != null ? G.dl : DIFF_NORMAL];
const scoreMulText = d => "X" + (d.score % 1 ? d.score.toFixed(2).replace(/0$/, "") : d.score);

}

/* ================================================================
   Mods, part two: three slots, levels, and the new mods' moving parts.
   You carry three mods. Finding one you already hold levels it up
   (to III). Finding a new one with full slots asks what to drop.
   ================================================================ */
SYNERGIES.push(
  {id: "permafrost", n: "PERMAFROST",    m: ["cold", "stun"],          d: "FROZEN OR SLOWED ENEMIES TAKE +1 FROM EVERY HIT.",      a: S => S.permafrost = true},
  {id: "supernova",  n: "SUPERNOVA",     m: ["nova", "split"],         d: "EVERY NOVA THROWS 2 MORE SHOTS.",                       a: S => S.supernova = true},
  {id: "juggernaut", n: "JUGGERNAUT",    m: ["ram", "bulwark"],        d: "YOUR DASH HITS HARDER AND KEEPS YOU SAFE LONGER.",      a: S => S.juggernaut = true},
  {id: "nest",       n: "SNIPER'S NEST", m: ["anchor", "longshot"],    d: "SHOTS RETURNED WHILE STANDING STILL COUNT AS LONG SHOTS.", a: S => S.nest = true},
  {id: "compound",   n: "COMPOUND",      m: ["interest", "salvage"],   d: "INTEREST CAN PAY OUT TWICE AS MUCH.",                  a: S => S.compound = true},
  {id: "horizon",    n: "EVENT HORIZON", m: ["gravity", "magnet"],     d: "SHOTS BEND MUCH HARDER, AND THE CATCH ZONE GROWS.",    a: S => { S.horizon = true; S.bandOut += 2; }},
  {id: "timelord",   n: "BORROWED TIME", m: ["stopwatch", "reflex"],   d: "STOPWATCH SLOWS THE WORLD TWICE AS LONG.",             a: S => S.timelord = true},
  {id: "deadringer", n: "DEAD RINGER",   m: ["afterimage", "twin"],    d: "YOUR GHOST SHIELD LASTS TWICE AS LONG.",               a: S => S.deadringer = true},
  {id: "thunder",    n: "THUNDERCLAP",   m: ["discharge", "shockwave"],d: "DISCHARGE HITS FOR 1 MORE.",                           a: S => S.thunder = true},
  {id: "orbit",      n: "CLOSE ORBIT",   m: ["satellite", "capacitor"],d: "ONE MORE DRONE CIRCLES YOU.",                          a: S => S.sat++},
  {id: "redmist",    n: "RED MIST",      m: ["berserk", "laststand"],  d: "ON YOUR LAST SHIELD YOU ALSO MOVE 30% FASTER.",        a: S => S.redmist = true}
);

/* ---------------- in the fight ---------------- */
function modTick(dt) {
  const S = G.S, p = G.p;
  const still = Math.hypot(p.vx, p.vy) < 24 && p.dashT <= 0 ? 1 : 0;
  G.anch += (still - G.anch) * Math.min(1, dt * 8);
  if (S.sat) satTick(dt);
  for (let i = G.decoys.length - 1; i >= 0; i--) { G.decoys[i].t -= dt; if (G.decoys[i].t <= 0) G.decoys.splice(i, 1); }
}
// GRAVITY WELL: enemy shots close to you curve toward the middle of your shield
function gravityBend(b, dt) {
  const p = G.p, S = G.S;
  const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
  if (d > 58 || d < S.bandOut - 2 || dx * b.vx + dy * b.vy >= 0) return;
  const gx = p.x + Math.cos(p.aim) * 13, gy = p.y + Math.sin(p.aim) * 13;
  let ba = Math.atan2(b.vy, b.vx);
  const da = ((Math.atan2(gy - b.y, gx - b.x) - ba + Math.PI * 3) % TAU) - Math.PI;
  const turn = S.gravity * (S.horizon ? 2.8 : 1.7) * dt;
  ba += clamp(da, -turn, turn);
  const bs = Math.hypot(b.vx, b.vy);
  b.vx = Math.cos(ba) * bs; b.vy = Math.sin(ba) * bs;
}
// SATELLITE: drones circle you, swing toward the nearest incoming shot and eat it, then need a moment to recharge
const SAT_R = 22, SAT_CD = 1.6;
function satTick(dt) {
  const S = G.S, p = G.p;
  if (!G.sats || G.sats.length !== S.sat) G.sats = Array.from({length: S.sat}, (_, k) => ({a: k * TAU / S.sat, cd: 0}));
  const taken = [];
  for (const d of G.sats) {
    if (d.cd > 0) d.cd -= dt;
    let best = null, bd = 56;
    if (d.cd <= 0) for (const b of G.bullets) {
      if (b.friend || taken.includes(b)) continue;
      const dx = b.x - p.x, dy = b.y - p.y, dist = Math.hypot(dx, dy);
      if (dist < bd && dist > SAT_R - 6 && dx * b.vx + dy * b.vy < 0) { bd = dist; best = b; }
    }
    if (best) {
      taken.push(best);
      const want = Math.atan2(best.y - p.y, best.x - p.x), da = ((want - d.a + Math.PI * 3) % TAU) - Math.PI;
      d.a += clamp(da, -9 * dt, 9 * dt);
    } else d.a += 2.4 * dt;
  }
}
function satPos(k) { const a = G.sats[k].a; return [G.p.x + Math.cos(a) * SAT_R, G.p.y + Math.sin(a) * SAT_R]; }
function satBlock(b) {
  if ((G.over && !G.won) || !G.sats) return false;
  for (let k = 0; k < G.sats.length; k++) {
    if (G.sats[k].cd > 0) continue;
    const [x, y] = satPos(k);
    if (Math.hypot(b.x - x, b.y - y) < 4.5 + b.r) {
      G.sats[k].cd = SAT_CD;
      burst(b.x, b.y, 6, C.la, 55, 0.25); tone(1600, 0.03, "square", 0.04);
      return true;
    }
  }
  return false;
}
// AFTERIMAGE: the ghost you leave behind catches too
function decoyCatch(b) {
  for (const d of G.decoys) {
    const dx = b.x - d.x, dy = b.y - d.y, dd = Math.hypot(dx, dy);
    if (dd > 5 && dd < 17 && dx * b.vx + dy * b.vy < 0) { parry(b, Math.atan2(dy, dx), false, d); return true; }
  }
  return false;
}
function modDamage(b, f) {
  const S = G.S;
  let d = S.dmg;
  if (S.longshot && (b.dist || 0) > 150) d += S.longshot;
  if (lastStand()) d++;
  if (S.momentum && G.combo >= 10) d++;
  if (S.permafrost && (f.stun > 0 || f.slowT > 0)) d++;
  return d;
}
// NOVA
function novaBurst(x, y) {
  const S = G.S, n = 2 + 2 * S.nova + (S.supernova ? 2 : 0), off = rand() * TAU;
  for (let k = 0; k < n && G.bullets.length < 480; k++) {
    const a = off + k / n * TAU;
    G.bullets.push({x: x + Math.cos(a) * 4, y: y + Math.sin(a) * 4, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 1.5, friend: true, life: 1.1,
      seek: 0.25, bounce: 0, chain: 1, fast: false, perfect: false, pierce: 0, rally: 0, nova: true, dist: 0});
  }
  ring(x, y, 12, C.or, 0.25);
}
function drawModFx() {
  if (!G || !G.S) return;
  const S = G.S, p = G.p, blink = Math.floor(G.t * 8) % 2;
  for (const d of G.decoys) {
    L.globalAlpha = 0.2 + 0.45 * (d.t / d.max);
    drawSpr(SPR.player, d.x, d.y);
    ringDots(d.x, d.y, 12, C.ye, 3);
    L.globalAlpha = 1;
  }
  if (S.sat && G.sats && !(G.over && !G.won)) G.sats.forEach((d, k) => {
    const [x, y] = satPos(k);
    if (d.cd > 0) { P(x, y, C.gy); return; }
    R(x - 1, y - 1, 3, 3, C.la); P(x, y, blink ? C.wh : C.bl);
  });
  if (p.whirlT > 0) ringDots(p.x, p.y, 13, C.ye, 2);
  for (const f of G.foes) {
    if (f.stun > 0 && SCARE.freeze <= 0) for (let k = 0; k < 3; k++) { const a = G.t * 5 + k * TAU / 3; P(f.x + Math.cos(a) * (f.r + 3), f.y - f.r - 3 + Math.sin(a) * 1.5, C.ye); }
    else if (f.slowT > 0 && blink) ringDots(f.x, f.y, f.r + 3, C.bl, 4);
    if (S.spotter && !f.dormant && f.born > 0.6 && FOE[f.type].cd < 50 && f.type !== "furnace" && f.cd > 0 && f.cd < 0.4)
      ringDots(f.x, f.y, f.r + 4 + f.cd * 12, C.wh, 3);
  }
  if (S.longshot) for (const b of G.bullets) if (b.friend && b.dist > 150) P(b.x, b.y - 2, C.or);
  if (G.p2Show > 0 && !(G.over && !G.won)) {
    const k = G.p2Show / 3.2, a = Math.min(1, k * 4, (1 - k) * 4) * (0.16 + rand() * 0.08);
    const gx = clamp(2 * ACX - p.x, AX0 + 10, AX1 - 10), gy = clamp(2 * ACY - p.y, AY0 + 10, AY1 - 10), ga = p.aim + Math.PI, arc = curArc();
    L.globalAlpha = a;
    drawSpr(SPR.ghostPlayer || SPR.player, gx, gy);
    arcPx(gx, gy, 13, ga - arc, ga + arc, C.lg, 2);
    L.globalAlpha = 1;
  }
}
// after a descent fight: coins, repairs, and a spent CONTINUE?
function modsAfterFight(win) {
  const S = G.S;
  run.leechK = G.leechK || 0;
  if (G.contUsed && run.mods.cont) { loseMod("cont", true); setTimeout(() => toast("CONTINUE? IS SPENT. THE SLOT IS EMPTY.", C.ye), 500); }
  if (!win) return;

    if (g > 0) { run.coins += g; setTimeout(() => toast("INTEREST: +" + g + " COINS", C.or), 300); }

}

/* ---------------- slots full: choose what to drop ---------------- */
const SwapScene = {
  // o: {id, price, done(took)} from the shop, otherwise the next mod waiting in run.pendingMods
  enter(o) {
    this.o = o && o.id ? o : null;
    this.id = this.o ? o.id : (run.pendingMods || [])[0];
    this.armed = -1; this.armT = 0;
    if (!this.id || !MODS[this.id]) { if (!this.o && run.pendingMods) run.pendingMods.shift(); return go(RunMap); }
    if (modFate(this.id) !== "swap") {   // a slot opened up (or it's already held): just take it
      if (!this.o) run.pendingMods.shift();
      gainMod(this.id); saveRun();
      return this.o ? this.o.done(true) : go(run.pendingMods.length ? SwapScene : RunMap);
    }
    music(run.depth === 5 ? "basement" : "map");
    sfx.secret();
  },
  decide(out) {
    const o = this.o, id = this.id;
    if (!o) run.pendingMods.shift();
    if (out) { swapMod(out, id); toast("DROPPED " + MODS[out].n + ". " + MODS[id].n + " IS IN.", RAR_COL[MODS[id].r]); }
    else if (!o) { run.coins += 15; toast("YOU LEAVE IT. +15 COINS", C.ye); }
    saveRun();
    if (o) return o.done(!!out);
    if (run.pendingMods.length) return go(SwapScene);
    go(RunMap);
  },
  arm(i, id) {
    if (this.armed === i && T - this.armT < 3) { this.armed = -1; this.decide(id); return; }
    this.armed = i; this.armT = T; sfx.deny(); fxWobble(0.2);
  },
  draw() {
    if (!run || !this.id) return;
    menuBg(PALS[DEPTH_PAL[run.depth]]);
    runHeader();
    title("YOUR SLOTS ARE FULL", 22, C.or);
    const id = this.id, m = MODS[id];
    txt(this.o ? "BUY FOR $" + this.o.price + ":" : "YOU FOUND:", 58, 38, C.lg, 1, "c");
    // the new mod, on its own on the left
    R(12, 45, 92, 120, C.ink); RO(12, 45, 92, 120, RAR_COL[m.r]); RO(13, 46, 90, 118, "#000");
    drawCardFace(id, 12, 45, 92, 120, false);
    txt("NEW", 58, 153, C.ye, 1, "c");
    txt("DROP ONE OF THESE:", 245, 38, C.lg, 1, "c");
    beginItems(this);
    const armed = this.armed >= 0 && T - this.armT < 3 ? this.armed : -1;
    ownedMods().slice(0, MOD_SLOTS).forEach((oid, i) => {
      drawCard(this, oid, 118 + i * 84, 45, 80, 120, () => this.arm(i, oid), null, {slot: true, armed: armed === i});
    });
    btn(this, this.o ? "DON'T BUY IT" : "KEEP MY MODS (+15 COINS)", W / 2 - 80, 176, 160, 14, () => this.decide(null), {col: C.gy});
    endItems(this);
    const hint = armed >= 0 ? "PRESS " + MODS[ownedMods()[armed]].n + " AGAIN TO DROP IT" : "YOU CAN CARRY " + MOD_SLOTS + " MODS. PICK ONE TO REPLACE, OR KEEP WHAT YOU HAVE.";
    wrap(hint, 340).forEach((l, i) => txt(l, W / 2, 198 + i * 8, armed >= 0 ? C.rd : C.gy, 1, "c"));
    if (activeSynergies().length) txt("CAREFUL: DROPPING A MOD CAN BREAK A SYNERGY.", W / 2, 216, C.pk, 1, "c");
  }
};

/* ---------------- learning the perfect catch ----------------
   A catch counts as perfect when the shot is already deep in the
   zone. New players sweep the shield early and never see one, so
   the inner line lights up and marks where the shot will land,
   until they have landed enough to feel it.                      */
const helperMode = () => (meta.settings.helper == null ? 1 : meta.settings.helper);
const helperOn = () => helperMode() === 2 || (helperMode() === 1 && (meta.stats.perfects || 0) < 120);
function drawCatchHelper() {
  if (!G || G.mode === "attract" || G.over || !helperOn()) return;
  const S = G.S, p = G.p;
  let best = null, bd = 40;
  for (const b of G.bullets) {
    if (b.friend) continue;
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
    if (d < bd && (dx * b.vx + dy * b.vy) < 0) { bd = d; best = b; }
  }
  if (!best) return;
  const a = Math.atan2(best.y - p.y, best.x - p.x), r = S.perfectD - 1;
  const now = bd <= S.perfectD + 2 && bd > S.bandIn;      // catch it right now
  const col = now ? C.wh : C.bl;
  for (let k = -2; k <= 2; k++) P(p.x + Math.cos(a + k * 0.1) * r, p.y + Math.sin(a + k * 0.1) * r, col);
  if (now) {
    ringDots(p.x, p.y, r, Math.floor(G.t * 20) % 2 ? C.wh : C.lg, 2);
    if (angDiff(a, p.aim) > curArc()) P(p.x + Math.cos(a) * (r + 3), p.y + Math.sin(a) * (r + 3), C.wh);
  }
}
const perfRate = (p, c) => c > 0 ? Math.round(p / c * 100) : 0;

function scareTick(dt) {

/* ---------------- the room ---------------- */
const StarliteScene = {
  walk: true,
  enter() {
    this.i = clamp(nextNight(), 1, NIGHT_COUNT);
    this.night = NIGHTS[this.i];
    this.px = 192; this.py = 190; this.face = 1; this.step = 0; this.items = [];
    this.said = {}; this.line = 0; this.done = false; this.fade = 1.4; this.endT = 0; this.dark = 0;
    this.dialog = {who: null, text: this.night.intro};
    this.target = null;
    musTrack = null;
    music(this.i >= 5 ? "basement" : "title");
    if (this.i >= 5) setTimeout(() => { if (scene === StarliteScene) tone(44, 2.4, "sine", 0.07); }, 1200);
  },
  back() { if (this.dialog) { this.dialog = null; return; } this.leave(); },
  leave() {
    if (this.done) return;
    this.done = true;
    const i = this.i;
    meta.nights = Math.max(meta.nights || 0, i);
    saveMeta();
    // the night itself goes into the archive
    if (!meta.loreDue) meta.loreDue = {};
    if (!loreRead("n" + i)) meta.loreDue["n" + i] = 1;
    saveMeta();
    fxGlitch(0.5); sfxGlitch(true);
    const out = this.night.out;
    setTimeout(() => {
      go(HubScene);
      setTimeout(() => toast(out, C.pe), 400);
      checkTapes();
      if (i >= NIGHT_COUNT) setTimeout(() => toast("THE DOOR ONLY OPENS ONTO AN EMPTY LOT NOW.", C.gy), 3400);
    }, 700);
  },
  spots() { return this.night.spots; },
  nearest() {
    let best = null, bd = 26;
    for (const s of this.spots()) { const d = Math.hypot(s.x - this.px, s.y - this.py); if (d < bd) { bd = d; best = s; } }
    return best;
  },
  use(s) {
    if (s.end) {
      // on the last night the lights go out before you reach the door
      if (this.night.last && !this.said.milo) { this.dialog = {who: null, text: "NOT YET. HE IS STILL PLAYING."}; return; }
      return this.leave();
    }
    const n = this.said[s.id] || 0;
    const line = s.lines[Math.min(n, s.lines.length - 1)];
    this.said[s.id] = n + 1;
    this.dialog = {who: s.who ? {n: s.n, role: this.night.d, col: s.who === "man" ? C.la : s.who === "girl" ? C.li : C.bl} : null, text: line};
    tone(s.who ? 520 + rand() * 60 : 300, 0.05, "square", 0.05);
    if (s.scare && n === s.lines.length - 1 && scaresOn()) { setTimeout(() => { hauntFace(0.3, true); stinger(0.6); }, 500); }
    // the last night ends when Milo has said everything
    if (this.night.last && s.key && this.said[s.id] >= s.lines.length) setTimeout(() => this.blackout(), 900);
  },
  blackout() {
    if (this.done || this.blacking) return;
    this.blacking = true;
    this.dialog = null;
    noise(0.5, 0.4, 300, 70);
    const steps = [0.25, 0.5, 0.75, 1];
    steps.forEach((k, i) => setTimeout(() => { if (scene === StarliteScene) { this.dark = k; tone(70 - i * 8, 0.5, "square", 0.08); } }, 700 + i * 700));
    setTimeout(() => { if (scene === StarliteScene) { whisper("AGAIN", {big: true, x: W / 2, y: 110, life: 2.6}); stinger(); } }, 3800);
    setTimeout(() => { if (scene === StarliteScene) this.leave(); }, 5200);
  },
  update(dt) {
    if (this.fade > 0) this.fade -= dt;
    if (this.dialog || this.done || this.blacking) {
      if (this.blacking) return;
      return;
    }
    let ax = 0, ay = 0;
    if (keys.a || keys.arrowleft) ax -= 1;
    if (keys.d || keys.arrowright) ax += 1;
    if (keys.w || keys.arrowup) ay -= 1;
    if (keys.s || keys.arrowdown) ay += 1;
    if (PAD.connected && (PAD.lx || PAD.ly)) { ax = PAD.lx; ay = PAD.ly; }
    if (TCH.mx || TCH.my) { ax = TCH.mx; ay = TCH.my; }
    if (this.target) {
      const dx = this.target.x - this.px, dy = this.target.y - this.py, d = Math.hypot(dx, dy);
      if (ax || ay) this.target = null;
      else if (d < 3) { const t = this.target; this.target = null; sfx.select(); if (t.spot) this.use(t.spot); return; }
      else { ax = dx / d; ay = dy / d; }
    }
    const m = Math.hypot(ax, ay);
    if (m > 1) { ax /= m; ay /= m; }
    this.px = clamp(this.px + ax * 88 * dt, 14, 370);
    this.py = clamp(this.py + ay * 88 * dt, 96, 206);
    if (ax) this.face = ax > 0 ? 1 : -1;
    if (m > 0.1) { this.step += dt * 8; if (Math.floor(this.step) % 2 === 0) tone(92, 0.02, "triangle", 0.03); }
  },
  key(k) {
    if (this.blacking) return true;
    if (this.dialog) { if (["enter", " ", "e", "escape"].includes(k)) { this.dialog = null; sfx.move(); } return true; }
    if (k === "enter" || k === " " || k === "e") { const s = this.nearest(); if (s) { sfx.select(); this.use(s); } else sfx.deny(); return true; }
    if (k === "escape") { this.leave(); return true; }
    return ["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k);
  },
  click(x, y) {
    if (this.blacking) return true;
    if (this.dialog) { this.dialog = null; return true; }
    for (const s of this.spots()) {
      const [bx, by, bw, bh] = s.box;
      if (x >= bx - 3 && x < bx + bw + 3 && y >= by - 3 && y < by + bh + 3) { this.target = {x: clamp(s.x, 14, 370), y: clamp(s.y, 96, 206), spot: s}; return true; }
    }
    if (y > 90) this.target = {x: clamp(x, 14, 370), y: clamp(y, 96, 206)};
    return true;
  },
  draw() {
    const n = this.night, lit = n.lit;

    R(0, 16, W, 74, "#191325");

    R(0, 88, W, 2, "#2A2038");
    for (let y = 90; y < 232; y += 10) for (let x = (y / 10 % 2) * 14; x < W; x += 28) {
      R(x, y, 13, 9, "#0E0A16");
      if ((x + y) % 3 === 0) P(x + 4, y + 4, "#241A33");
      if ((x + y) % 7 === 0) P(x + 9, y + 6, "#2A1030");
    }
    // the sign over the counter
    const sign = Math.floor(T * 2) % 9 === 0 && lit < 0.6 ? "STARL TE" : "STARLITE";
    txtS(sign, 62, 24, lit > 0.5 ? C.pk : C.pl, 2, "c", C.k);
    // the front window and the street
    R(160, 20, 68, 34, "#060B18"); RO(160, 20, 68, 34, C.nv);
    for (let i = 0; i < 10; i++) P(163 + ((i * 17) % 62), 22 + ((T * 30 + i * 9) % 30), i % 3 ? C.nv : C.la);
    if (n.spots.some(s => s.id === "bike")) { R(186, 44, 14, 2, C.bl); P(185, 46, C.bl); P(199, 46, C.bl); R(192, 39, 1, 5, C.bl); }
    // the row of cabinets along the back wall
    const cabs = [[96, "#2A1A3A", C.li], [122, "#1A2A3A", C.bl], [148, "#3A1A2A", C.pk], [268, "#2A2A1A", C.ye], [294, "#1A3A2A", C.gr]];
    for (const [x, body, glow] of cabs) {

      if (lit > 0.3 || Math.floor(T * 1.5 + x) % 3) { L.globalAlpha = 0.5 + 0.3 * lit; R(x + 3, 61, 16, 10, glow); L.globalAlpha = 1; }
      R(x + 4, 76, 14, 3, "#0A0810");
    }
    // 0417, at the end of the row
    const cx = 250;
    R(cx - 12, 54, 26, 38, "#241A3A"); RO(cx - 12, 54, 26, 38, C.pl);
    R(cx - 9, 58, 20, 14, "#000");
    const on = this.i !== 5 || true;
    if (on) {
      R(cx - 8, 59, 18, 12, Math.floor(T * 3) % 2 ? "#170D24" : "#1E0F2E");
      // the little player on its screen, pointing the shield at the glass on the bad nights
      const sx = cx - 1 + (this.i >= 5 ? Math.round(Math.sin(T * 0.7) * 2) : Math.round(Math.sin(T * 3) * 5));

/* ---------------- how it behaves ---------------- */
function unitStep(f, p, dt) {
  if (f.guardT > 0) f.guardT -= dt;
  if (f.born < 1.4 || G.over) return;
  f.talk = (f.talk == null ? 5 : f.talk) - dt;
  if (f.talk <= 0) {
    f.talk = f.p2 ? 5 + rand() * 4 : 8 + rand() * 5;
    const l = f.p2 ? ["MY TURN", "AGAIN", "STAY", "PLAYER 2 READY"] : ["INSERT COIN", "PLAY AGAIN?", "0417", "LEARNING"];
    floatTxt(f.x, f.y - 20, pick(l), f.p2 ? C.rd : C.bl);
    tone(f.p2 ? 70 : 120, 0.18, "square", 0.07);
  }
  if (f.p2) {
    f.lights = (f.lights == null ? 6 : f.lights) - dt;
    if (f.lights <= 0) {
      f.lights = 7 + rand() * 4;
      G.lightsOut = 1.8; G.dark = true;
      floatTxt(p.x, p.y - 18, "LIGHTS OUT", C.rd);
      noise(0.35, 0.12, 500, 90); tone(64, 0.5, "square", 0.1, 34);
      setTimeout(() => { if (G && G.mode === "run" && run && run.lantern) G.dark = false; }, 2200);
    }
  }
}
function unitFire(f, diff) {
  const p = G.p, aim = Math.atan2(p.y - f.y, p.x - f.x);
  const base = FOE.unit0417;
  f.stage = (f.stage || 0) + 1;
  if (f.p2) {
    // it plays like a player now: quick aimed shots, and it keeps its guard up between them
    fire(f, aim, 150 * diff, 2, true);
    if (f.stage % 3 === 0) for (let j = -2; j <= 2; j++) fire(f, aim + j * 0.18, 96 * diff, 1.5);
    if (f.stage % 5 === 0) for (let j = 0; j < 16; j++) fire(f, j / 16 * TAU + f.stage * 0.3, 62 * diff, 2);
    f.guardT = 1.1;
    f.cd = base.cd / diff * 0.72;
    sfx.snipe();
    return;
  }
  if (f.stage % 4 === 0) {
    // the rest of the recall: units that never left the floor
    const live = G.foes.filter(o => !FOE[o.type].boss).length;
    if (live < 4) { for (const k of [-1, 1]) spawnFoe(pick(["armor", "mirror", "shielder"]), {x: f.x + k * 26, y: f.y + 10}); floatTxt(f.x, f.y - 26, "UNITS 0400-0420", C.bl); G.shake = 4; }
    else for (let j = 0; j < 14; j++) fire(f, j / 14 * TAU + f.plate, 64 * diff, 2);
  } else if (f.stage % 2) {
    for (let j = -2; j <= 2; j++) fire(f, aim + j * 0.15, 92 * diff, 2);
  } else {
    const off = f.plate;
    for (let j = 0; j < 10; j++) fire(f, off + j / 10 * TAU, 70 * diff, 2);
  }
  f.cd = base.cd / diff;
  sfx.shoot();
}

    if (shown) { R(40, 196, 304, 20, C.ink); RO(40, 196, 304, 20, C.nv); wrap(shown.d, 290).slice(0, 2).forEach((l, i) => txt(l, 47, 200 + i * 7, C.lg)); }
  }
};

    btn(this, "ONLINE", 192, 212, 88, 12, () => go(OnlineScene), {col: C.bl});

/* ---------------- codes (DOM modal) ---------------- */
const $ = id => document.getElementById(id);
let modalOpen = false, modalApply = null;
function openModal(titleTxt, desc, value, applyLabel, apply) {
  modalOpen = true; modalApply = apply;
  $("m-title").textContent = titleTxt; $("m-desc").textContent = desc;
  $("m-text").value = value || ""; $("m-text").readOnly = !apply;
  $("m-ok").hidden = !apply; $("m-ok").textContent = applyLabel || "APPLY";
  $("m-msg").textContent = ""; $("m-msg").className = "msg";
  $("modal").hidden = false;
  setTimeout(() => { $("m-text").focus(); if (!apply) $("m-text").select(); }, 30);
}
function closeModal() { modalOpen = false; $("modal").hidden = true; for (const k in keys) keys[k] = false; }
function modalMsg(t, bad) { $("m-msg").textContent = t; $("m-msg").className = "msg" + (bad ? " bad" : ""); }
$("m-close").addEventListener("click", closeModal);
$("m-copy").addEventListener("click", () => { $("m-text").focus(); $("m-text").select(); try { document.execCommand("copy"); modalMsg("COPIED (OR PRESS CTRL+C)."); } catch (e) { modalMsg("SELECTED. PRESS CTRL+C TO COPY."); } });
$("m-ok").addEventListener("click", () => { if (modalApply) modalApply($("m-text").value.trim()); });
$("modal").addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); e.stopPropagation(); });
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });

function scoreCode(e) { const body = e.i + "-" + e.s + "-" + (e.w || 0); return "RIP-" + body + "-" + hash(body + "|riposte").slice(-4); }
function openShare() {
  const mine = meta.arcade.filter(e => !e.friend)[0];
  if (!mine) return;
  openModal("SHARE YOUR BEST", "SEND THIS CODE TO A FRIEND. THEY PASTE IT INTO ADD FRIEND CODE AND YOUR SCORE SHOWS ON THEIR BOARD.", scoreCode(mine), null, null);
}
function openAddFriend() {
  openModal("ADD A FRIEND'S SCORE", "PASTE THE RIP- CODE A FRIEND SENT YOU.", "", "ADD TO BOARD", v => {
    const m = /^RIP-([A-Z0-9]{1,3})-(\d{1,9})-(\d{1,4})-([A-Z0-9]{1,4})$/i.exec(v.replace(/\s+/g, ""));
    if (!m) return modalMsg("THAT DOESN'T LOOK LIKE A SCORE CODE.", true);
    const body = m[1].toUpperCase() + "-" + m[2] + "-" + m[3];
    if (hash(body + "|riposte").slice(-4) !== m[4].toUpperCase()) return modalMsg("THE CODE DOESN'T CHECK OUT. WAS IT COPIED IN FULL?", true);
    const e = {i: m[1].toUpperCase(), s: parseInt(m[2], 10), w: parseInt(m[3], 10), friend: true};
    if (meta.arcade.some(x => x.friend && x.i === e.i && x.s === e.s)) return modalMsg("ALREADY ON YOUR BOARD.", true);
    meta.arcade.push(e); meta.arcade.sort((a, b) => b.s - a.s); meta.arcade = meta.arcade.slice(0, 10); saveMeta();
    modalMsg(meta.arcade.includes(e) ? "ADDED. " + e.i + " IS ON YOUR BOARD." : "VALID, BUT IT DIDN'T MAKE YOUR TOP 10.");
  });
}
function openBackup() {
  const json = JSON.stringify(meta);
  let b64 = "";
  try { b64 = btoa(unescape(encodeURIComponent(json))); } catch (e) { b64 = ""; }
  openModal("BACK UP YOUR SAVE", "PROGRESS IS STORED IN THIS BROWSER. KEEP THIS CODE SOMEWHERE SAFE. RESTORE SAVE BRINGS EVERYTHING BACK, ON ANY DEVICE.",
    "RSV3." + b64 + "." + hash(b64).slice(-5), null, null);
}
function openRestore() {
  openModal("RESTORE A SAVE", "PASTE A BACKUP CODE. THIS REPLACES YOUR CURRENT PROGRESS.", "", "RESTORE", v => {
    const parts = v.replace(/\s+/g, "").split(".");
    if (parts.length !== 3 || parts[0] !== "RSV3") return modalMsg("THAT ISN'T A RIPOSTE SAVE CODE.", true);
    if (hash(parts[1]).slice(-5) !== parts[2]) return modalMsg("THE CODE IS DAMAGED. COPY IT AGAIN IN FULL.", true);
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(parts[1]))));
      meta = mergeDeep(freshMeta(), data); saveMeta();
      modalMsg("RESTORED. WELCOME BACK.");
    } catch (e) { modalMsg("COULDN'T READ THAT SAVE.", true); }
  });
}

/* ---------------- input ---------------- */
let lastPointerTouch = false;
window.addEventListener("keydown", e => {
  if (modalOpen || !e || typeof e.key !== "string") return;
  const k = e.key.toLowerCase();
  lastPointerTouch = false; usedKeyboard = true;
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "tab"].includes(k)) e.preventDefault();
  audioInit();
  if (e.repeat && (k === " " || k === "enter" || k === "tab")) return;
  keys[k] = true;
  lastInput = T;
  if (k === "f11" || (k === "enter" && e.altKey)) { e.preventDefault(); toggleFullscreen(); return; }
  if (k === "m" && !(scene && scene.captureKeys)) { cycleSound(); return; }
  if (k === "escape" && scene && scene.back && !scene.captureKeys) { scene.back(); return; }
  if (scene && scene.key && scene.key(k)) return;
  if (scene) menuKey(scene, k);
});
window.addEventListener("keyup", e => { if (e && typeof e.key === "string") keys[e.key.toLowerCase()] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (inCombat() && G && !G.over) G.paused = true; });

screenCv.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") { if (touchMode()) { touchMove(e); return; } }
  const p = toLo(e);
  if (Math.abs(p.x - mouse.x) + Math.abs(p.y - mouse.y) > 2) { lastInput = T; PAD.useAim = false; }
  mouse.x = p.x; mouse.y = p.y;
  if (scene && !(inCombat() && G && !G.paused)) menuMove(scene, p.x, p.y);
});
screenCv.addEventListener("pointerdown", e => {
  audioInit(); lastInput = T;
  lastPointerTouch = e.pointerType === "touch";
  if (e.pointerType === "mouse") mouseUsed = true;
  if (G) G.touch = lastPointerTouch;
  if (lastPointerTouch) touchFirstGesture();
  // thumbs in a fight: sticks and buttons
  const tm = lastPointerTouch ? touchMode() : null;
  if (tm) { touchDown(e, tm); return; }
  const p = toLo(e); mouse.x = p.x; mouse.y = p.y;
  if (inCombat() && G && !G.paused) { if (e.button === 2) doPulse(); return; }
  if (scene && scene.click && scene.click(p.x, p.y)) return;
  if (scene) { if (!lastPointerTouch) menuMove(scene, p.x, p.y); menuClick(scene, p.x, p.y); }
});
screenCv.addEventListener("pointerup", e => { if (e.pointerType === "touch") { touchUp(e); audioInit(); } });
screenCv.addEventListener("pointercancel", e => { if (e.pointerType === "touch") touchUp(e); });
// a long press on a phone opens the context menu: never let that pulse
screenCv.addEventListener("contextmenu", e => { e.preventDefault(); if (inCombat() && !lastPointerTouch) doPulse(); });

/* ---------------- loop ---------------- */
let last = performance.now(), errCount = 0;
function recover(err) {
  errCount++;
  if (errCount < 6 && window.console) console.error("[riposte]", err);
  try {
    if (G) {
      G.bullets = G.bullets.filter(b => b && isFinite(b.x) && isFinite(b.y));
      G.foes = G.foes.filter(f => f && isFinite(f.x) && isFinite(f.y));
      G.parts = []; G.floats = [];
      if (!isFinite(G.p.x) || !isFinite(G.p.y)) { G.p.x = ACX; G.p.y = ACY; G.p.vx = G.p.vy = 0; }
    }
    L.setTransform(RS, 0, 0, RS, 0, 0); L.globalAlpha = 1; L.globalCompositeOperation = "source-over";
    if (errCount > 40) { errCount = 0; go(TitleScene); }
  } catch (e2) {}
}
function frame(now) {
  try {
    let raw = Math.min(0.1, (now - last) / 1000);
    if (!(raw >= 0)) raw = 1 / 60;
    last = now; T += raw;
    fxTick(raw, inCombat() && G && !G.paused);
    if (inCombat() && G && G.mode !== "attract" && !G.over && G.lives === 1) FX.wobble = Math.max(FX.wobble, 0.12);
    pollPad(raw);
    hauntTick(raw);
    if (typeof onlineTick === "function") onlineTick(raw);
    drawTouchUI();
    if (scene.update) scene.update(raw);
    L.setTransform(RS, 0, 0, RS, 0, 0); L.globalAlpha = 1; L.globalCompositeOperation = "source-over";
    scene.draw();
    drawHauntOverlay();
    drawFxOverlay();
    drawToasts(raw);
    if (updatePending) {
      if (safeToReload()) applyUpdate();
      else if (!updateNoticed) { updateNoticed = true; toast("NEW VERSION READY. IT LOADS WHEN THIS FIGHT OR SCREEN ENDS.", C.li); }
    }
    present();
    musicTick();
  } catch (err) { recover(err); }
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
/* ---------------- live update (installed app) ----------------
   The desktop launcher opens this file with file-access allowed, so the page
   can re-read itself. When the file on disk changes (and has finished being
   written), the game saves and reloads at the next safe moment. */
let updatePending = false, updateNoticed = false;
function safeToReload() {
  return !modalOpen && [TitleScene, RunMap, WorkshopScene, RecordsScene, ArcadeOver, ShieldSelect, RunOver,
    HubScene, CodexScene, HistoryScene, OnlineScene, DailyScene, SettingsScene, PlayersScene, ModesScene].includes(scene);
}
function applyUpdate() {
  updatePending = false;
  try {
    saveMeta();
    if (run && scene === RunMap) saveRun();
    const where = scene === RunMap ? "map" : scene === WorkshopScene ? "workshop" : scene === RecordsScene ? "records"
      : scene === HubScene || hubReturn ? "hub" : "title";
    sessionStorage.setItem("riposte.resume", where);
    sessionStorage.setItem("riposte.updated", "1");
  } catch (e) {}
  location.reload();
}
(function watchSelf() {
  const isFile = location.protocol === "file:";
  if (!isFile && !window.RIPOSTE_APP) return;
  const url = isFile ? location.href.split("#")[0].split("?")[0] : "/riposte.html";
  let base = null, cand = null;
  function check() {
    const x = new XMLHttpRequest();
    x.onload = () => {
      const t = x.responseText || "";
      if (t.length > 1000) {
        const h = hash(t);
        if (base === null) base = h;
        else if (h !== base) {
          // only act once the new file has stopped changing and is complete
          if (cand === h && /<\/html>\s*$/i.test(t)) { updatePending = true; return; }
          cand = h;
        } else cand = null;
      }
      setTimeout(check, cand ? 700 : 2000);
    };
    x.onerror = () => { /* opened without file access (old shortcut): no live updates */ };
    try { x.open("GET", isFile ? url : url + "?t=" + Date.now(), true); x.send(); } catch (e) {}
  }
  setTimeout(check, 1500);
})();

function toggleFullscreen(silent) {
  if (!silent) fxGlitch(0.3);
  if (window.rpToggleFullscreen) {
    try { window.rpToggleFullscreen(); } catch (e) {}
    meta.settings.fullscreen = !meta.settings.fullscreen; saveMeta();   // remembered for next launch
    return;
  }
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else goFullscreen();
  } catch (e) {}
}

if (window.RIPOSTE_APP) document.body.classList.add("app");   // the program's own window: no fake bezel
let fsRestored = false;
function restoreFullscreen() {
  if (fsRestored || resumed || !window.RIPOSTE_APP || !meta.settings.fullscreen || !window.rpToggleFullscreen) return;
  fsRestored = true;
  try { window.rpToggleFullscreen(); } catch (e) {}
}
setTimeout(restoreFullscreen, 60);
buildSprites();
fit();
let resumed = false;
try { resumed = !!sessionStorage.getItem("riposte.resume"); } catch (e) {}
go(resumed ? afterBoot() : BootScene);   // after a live update, players without a name still get asked once
try {
  const where = sessionStorage.getItem("riposte.resume");
  const updated = sessionStorage.getItem("riposte.updated");
  sessionStorage.removeItem("riposte.resume"); sessionStorage.removeItem("riposte.updated");
  if (where === "map") { const r = loadRun(); if (r) { run = r; go(RunMap); } }
  else if (where === "hub") go(HubScene);
  else if (where === "workshop") go(WorkshopScene);
  else if (where === "records") go(RecordsScene);
  if (updated) toast("UPDATED TO VERSION " + VERSION, C.li);
} catch (e) {}
requestAnimationFrame(frame);
